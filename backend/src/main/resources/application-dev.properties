# ===================================================================
# Dev Profile Configuration
# ===================================================================

# Hibernate Batching Optimization for High-Performance Seeding
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Keep SQL logging disabled during bulk inserts to avoid terminal flooding
spring.jpa.show-sql=false

# Seeder Configuration
# Runs only when profile 'dev' is active and employee count == 0
app.seed.enabled=true
app.seed.count=10000
app.seed.batch-size=1000
app.seed.force-reset=false
