spring.application.name=employee-salary-management
spring.datasource.url=jdbc:postgresql://localhost:5432/acme_db
spring.datasource.username=acme_user

# We can use AWS secrets here to store the password, but for now, we will use a local password.
spring.datasource.password=Hello@World

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false